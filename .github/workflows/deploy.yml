name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate guides from the committed xlsx — no DATABASE_URL needed.
      - name: Generate guides static data
        run: node scripts/generate-guides-from-xlsx.cjs

      - name: Export trails static data
        run: pnpm tsx scripts/export-trails-static.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Supabase migrations (optional - skipped if SUPABASE_DB_URL not set)
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Running Supabase migrations..."
            psql "$SUPABASE_DB_URL" -f supabase/migrations/001_create_expeditions.sql
          else
            echo "SUPABASE_DB_URL not set, skipping DB migration"
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        continue-on-error: true

      - name: Build frontend
        run: pnpm vite build --base=/
        env:
          NODE_ENV: production
          VITE_STATIC_MODE: "true"
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy index.html to 404.html (SPA routing)
        run: cp dist/public/index.html dist/public/404.html

      - name: Add CNAME
        run: echo "www.trekko.com.br" > dist/public/CNAME

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          force_orphan: true
