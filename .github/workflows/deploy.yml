name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  # Triggers a Render deploy so the API server is always in sync with the
  # frontend. Set RENDER_DEPLOY_HOOK_URL in GitHub secrets to enable this
  # (Render → Service → Settings → Deploy Hook → copy the URL).
  deploy-backend:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_DEPLOY_HOOK_URL != '' || secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate guides from the committed xlsx — no DATABASE_URL needed.
      # If DATABASE_URL is available it will also run the DB-based exporter
      # to pick up any newly registered Trekko guides (isVerified flag).
      - name: Generate guides static data
        run: node scripts/generate-guides-from-xlsx.cjs

      - name: Export trails static data
        run: pnpm tsx scripts/export-trails-static.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build frontend
        run: pnpm vite build --base=/
        env:
          NODE_ENV: production
          VITE_STATIC_MODE: "true"
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Copy index.html to 404.html (SPA routing)
        run: cp dist/public/index.html dist/public/404.html

      - name: Add CNAME
        run: echo "www.trekko.com.br" > dist/public/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          force_orphan: true
