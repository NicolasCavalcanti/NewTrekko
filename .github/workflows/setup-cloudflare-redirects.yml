name: Setup Cloudflare Trailing Slash Redirects

on:
  push:
    branches:
      - claude/optimistic-bohr-z8CKE

jobs:
  configure-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Set Zone ID (trekko.com.br)
        id: zone
        run: |
          echo "zone_id=609ad498e4f2043864d25384832d9d15" >> $GITHUB_OUTPUT
          echo "Zone: trekko.com.br (609ad498e4f2043864d25384832d9d15)"

      - name: Verify token permissions
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          VERIFY=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "Token verify: $(echo "$VERIFY" | jq -r '.result.status // .errors[0].message')"

      - name: List existing Page Rules
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          EXISTING=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/pagerules?status=active" \
            -H "Authorization: Bearer $CF_TOKEN")
          COUNT=$(echo "$EXISTING" | jq '.result | length')
          echo "Existing active page rules: $COUNT"
          echo "$EXISTING" | jq -r '.result[]? | "  - [\(.id)] \(.targets[0].constraint.value) → \(.actions[0].value.url // .actions[0].id)"'

      - name: Create Page Rule — /path/ → /path (301)
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/pagerules" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "targets": [
                {
                  "target": "url",
                  "constraint": {
                    "operator": "matches",
                    "value": "*trekko.com.br/*/"
                  }
                }
              ],
              "actions": [
                {
                  "id": "forwarding_url",
                  "value": {
                    "url": "https://trekko.com.br/$2",
                    "status_code": 301
                  }
                }
              ],
              "priority": 1,
              "status": "active"
            }')

          echo "success: $(echo "$RESPONSE" | jq -r '.success')"
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "--- errors ---"
            echo "$RESPONSE" | jq '.errors'
            echo "--- messages ---"
            echo "$RESPONSE" | jq '.messages'
            echo "--- full response ---"
            echo "$RESPONSE" | jq '.'
            exit 1
          fi
          RULE_ID=$(echo "$RESPONSE" | jq -r '.result.id')
          echo "Page Rule active. ID: $RULE_ID"
          echo "Rule: *trekko.com.br/*/ → 301 → https://trekko.com.br/\$2"
