name: Remove Cloudflare Trailing Slash Page Rule

on:
  push:
    branches:
      - claude/optimistic-bohr-z8CKE

jobs:
  remove-cloudflare-rule:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Page Rule *trekko.com.br/*/
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: 609ad498e4f2043864d25384832d9d15
        run: |
          # Find the rule with pattern *trekko.com.br/*/
          EXISTING=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/pagerules" \
            -H "Authorization: Bearer $CF_TOKEN")

          RULE_ID=$(echo "$EXISTING" | jq -r \
            '.result[]? | select(.targets[0].constraint.value == "*trekko.com.br/*/") | .id' | head -1)

          if [ -z "$RULE_ID" ] || [ "$RULE_ID" = "null" ]; then
            echo "No matching Page Rule found — nothing to delete."
            echo "$EXISTING" | jq -r '.result[]? | "  existing: [\(.id)] \(.targets[0].constraint.value)"'
            exit 0
          fi

          echo "Found rule ID: $RULE_ID — deleting..."
          DEL=$(curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/pagerules/${RULE_ID}" \
            -H "Authorization: Bearer $CF_TOKEN")

          SUCCESS=$(echo "$DEL" | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then
            echo "Page Rule deleted successfully. Redirect loop removed."
          else
            echo "Delete failed:"
            echo "$DEL" | jq '.'
            exit 1
          fi
