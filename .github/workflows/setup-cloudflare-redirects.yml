name: Setup Cloudflare Trailing Slash Redirects

on:
  push:
    branches:
      - claude/optimistic-bohr-z8CKE

jobs:
  configure-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Get Cloudflare Zone ID for trekko.com.br
        id: zone
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # List all zones to diagnose which domains are in this account
          ALL_ZONES=$(curl -s "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          echo "All zones in account:"
          echo "$ALL_ZONES" | jq -r '.result[] | "\(.id) \(.name) (\(.status))"' 2>/dev/null || echo "(none or error)"

          # Try exact match on trekko.com.br
          RESPONSE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=trekko.com.br" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          ZONE_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // empty')

          # Fallback: try www.trekko.com.br or any zone containing trekko
          if [ -z "$ZONE_ID" ]; then
            ZONE_ID=$(echo "$ALL_ZONES" | jq -r '.result[] | select(.name | contains("trekko")) | .id' | head -1)
            ZONE_NAME=$(echo "$ALL_ZONES" | jq -r '.result[] | select(.name | contains("trekko")) | .name' | head -1)
            if [ -n "$ZONE_ID" ]; then
              echo "Found zone via fallback: $ZONE_NAME ($ZONE_ID)"
            fi
          fi

          if [ -z "$ZONE_ID" ]; then
            echo "ERROR: trekko.com.br zone not found. Check the zones listed above."
            exit 1
          fi
          echo "zone_id=$ZONE_ID" >> $GITHUB_OUTPUT
          echo "Zone ID: $ZONE_ID"

      - name: Create Redirect Rule — /path/ → /path (301)
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          RESPONSE=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_dynamic_redirect/entrypoint" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Redirect Rules Entrypoint",
              "description": "Redirect trailing slashes to canonical URLs",
              "rules": [
                {
                  "description": "Remove trailing slash — 301",
                  "expression": "ends_with(http.request.uri.path, \"/\") and http.request.uri.path != \"/\"",
                  "action": "redirect",
                  "action_parameters": {
                    "from_value": {
                      "status_code": 301,
                      "target_url": {
                        "expression": "concat(\"https://\", http.host, substring(http.request.uri.path, 0, len(http.request.uri.path) - 1))"
                      },
                      "preserve_query_string": true
                    }
                  }
                }
              ]
            }')

          echo "Ruleset response success: $(echo "$RESPONSE" | jq -r '.success')"
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: Failed to create redirect rule"
            echo "$RESPONSE" | jq '.errors'
            exit 1
          fi
          RULE_ID=$(echo "$RESPONSE" | jq -r '.result.rules[0].id')
          echo "Redirect rule active. ID: $RULE_ID"
          echo ""
          echo "Rule: ends_with(path, '/') AND path != '/' → 301 to same path without trailing slash"
