    <script>
    (function(){
      var seeds={
        'trekko_reviews_trail_1':[
          {id:1001,userId:0,rating:5,comment:"Visual incrível no topo do tepui: quartzo brilhando sob os pés e o horizonte riscado pela fronteira com a Venezuela. Nenhuma foto prepara você para o que é estar ali depois de oito dias de trilha.",userName:"Carlos M.",userPhotoUrl:null,isVerified:0,createdAt:"2024-11-12T14:32:00.000Z",updatedAt:"2024-11-12T14:32:00.000Z",images:[]},
          {id:1002,userId:0,rating:4,comment:"Trilha exigente do começo ao fim, mas o guia indígena Pemón faz toda a diferença. Eles conhecem cada desvio, cada nascente e cada ponto de abrigo entre o Rio Tek e o cume.",userName:"Fernanda R.",userPhotoUrl:null,isVerified:0,createdAt:"2025-01-08T09:15:00.000Z",updatedAt:"2025-01-08T09:15:00.000Z",images:[]},
          {id:1003,userId:0,rating:5,comment:"Dica para quem vai: separe os primeiros quilômetros para aclimatação porque a subida final ao tepui exige pulmão. Leve filtro de água, as nascentes no topo são abundantes mas vale filtrar.",userName:"Ricardo A.",userPhotoUrl:null,isVerified:0,createdAt:"2025-03-20T16:45:00.000Z",updatedAt:"2025-03-20T16:45:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_2':[
          {id:2001,userId:0,rating:5,comment:"Vale cada passo da travessia. Ver o Dedo de Deus de perto, cruzar os campos de altitude e chegar à Pedra do Sino com vista do litoral fluminense são momentos que não saem da memória.",userName:"Ana C.",userPhotoUrl:null,isVerified:0,createdAt:"2024-10-03T08:20:00.000Z",updatedAt:"2024-10-03T08:20:00.000Z",images:[]},
          {id:2002,userId:0,rating:4,comment:"Prepare-se para ganho de altitude de mais de dois mil metros em três dias. O segundo dia é o mais puxado, com trechos expostos e boqueirões molhados que exigem atenção redobrada.",userName:"Marcos S.",userPhotoUrl:null,isVerified:0,createdAt:"2024-12-19T11:05:00.000Z",updatedAt:"2024-12-19T11:05:00.000Z",images:[]},
          {id:2003,userId:0,rating:5,comment:"O trecho final antes de Teresópolis tem descida longa em pedra escorregadia quando chove. Calçado com bom grip faz diferença e o bastão alivia bastante nos joelhos na hora da descida.",userName:"Juliana P.",userPhotoUrl:null,isVerified:0,createdAt:"2025-02-14T15:30:00.000Z",updatedAt:"2025-02-14T15:30:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_3':[
          {id:3001,userId:0,rating:5,comment:"Visual incrível nas formações do Vale da Lua: o Rio São Miguel esculpiu cada curva daquelas rochas em milhões de anos. A luz da manhã bate diferente nas pedras e a cor da água muda conforme a hora.",userName:"Pedro L.",userPhotoUrl:null,isVerified:0,createdAt:"2024-09-07T07:45:00.000Z",updatedAt:"2024-09-07T07:45:00.000Z",images:[]},
          {id:3002,userId:0,rating:4,comment:"Dica para quem vai: chegue cedo porque o parque controla a entrada e o sol do cerrado esquenta rápido. A trilha tem pouca sombra depois das dez e a hidratação precisa ser constante.",userName:"Lucia B.",userPhotoUrl:null,isVerified:0,createdAt:"2024-11-23T10:00:00.000Z",updatedAt:"2024-11-23T10:00:00.000Z",images:[]},
          {id:3003,userId:0,rating:5,comment:"Trilha acessível para toda a família, mas as cachoeiras surpreendem até quem é experiente. A água da Cachoeira Santa Bárbara tem cor azul-esverdeada que parece artificial de tão limpa.",userName:"Bruno T.",userPhotoUrl:null,isVerified:0,createdAt:"2025-01-30T13:20:00.000Z",updatedAt:"2025-01-30T13:20:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_4':[
          {id:4001,userId:0,rating:5,comment:"O trecho final de escadaria na rocha é mais psicológico que físico. São 600 degraus no granito sem proteção lateral e o vento lá em cima pesa. A vista de 360 graus da Mantiqueira compensa tudo.",userName:"Gustavo N.",userPhotoUrl:null,isVerified:0,createdAt:"2024-08-15T09:50:00.000Z",updatedAt:"2024-08-15T09:50:00.000Z",images:[]},
          {id:4002,userId:0,rating:4,comment:"Prepare-se para uma trilha sem pontos de água no percurso. Leve no mínimo dois litros porque a exposição solar na subida é intensa e a descida pela escadaria consome mais energia do que parece.",userName:"Patricia F.",userPhotoUrl:null,isVerified:0,createdAt:"2024-10-27T14:10:00.000Z",updatedAt:"2024-10-27T14:10:00.000Z",images:[]},
          {id:4003,userId:0,rating:5,comment:"Vale cada passo da subida. O pôr do sol lá do topo com a silhueta do Bauzinho ao lado é uma das vistas mais bonitas da Mantiqueira. Chegue com tempo para aproveitar antes de escurecer.",userName:"Diego W.",userPhotoUrl:null,isVerified:0,createdAt:"2024-12-05T16:55:00.000Z",updatedAt:"2024-12-05T16:55:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_5':[
          {id:5001,userId:0,rating:5,comment:"Prepare-se para acordar na madrugada se quiser chegar ao cume antes do nascer do sol. O esforço vale cada segundo quando o mar de nuvens começa a ganhar tom dourado e o Brasil parece estar abaixo de você.",userName:"Rafael O.",userPhotoUrl:null,isVerified:0,createdAt:"2024-07-18T04:30:00.000Z",updatedAt:"2024-07-18T04:30:00.000Z",images:[]},
          {id:5002,userId:0,rating:5,comment:"Visual incrível no cume a quase 2900 metros: mar de nuvens sem fim, silêncio absoluto e a sensação de estar acima de boa parte do país. O campo de altitude tem flora endêmica que não existe em nenhum outro lugar.",userName:"Camila E.",userPhotoUrl:null,isVerified:0,createdAt:"2024-09-22T06:15:00.000Z",updatedAt:"2024-09-22T06:15:00.000Z",images:[]},
          {id:5003,userId:0,rating:4,comment:"Dica para quem vai: o camping do Terreirão fica a cerca de uma hora do cume. A saída de madrugada evita o calor e a temperatura no topo pode surpreender quem não leva agasalho.",userName:"Victor H.",userPhotoUrl:null,isVerified:0,createdAt:"2024-11-09T07:40:00.000Z",updatedAt:"2024-11-09T07:40:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_6':[
          {id:6001,userId:0,rating:5,comment:"Visual incrível no interior do cânion: paredões de 720 metros de cada lado e o Rio do Boi cortando o leito entre araucárias centenárias. A perspectiva lá de baixo não tem igual no Brasil.",userName:"Eduardo K.",userPhotoUrl:null,isVerified:0,createdAt:"2024-06-11T10:25:00.000Z",updatedAt:"2024-06-11T10:25:00.000Z",images:[]},
          {id:6002,userId:0,rating:4,comment:"Trilha exigente com várias travessias do rio ao longo da descida. No inverno a água está gelada e as pedras ficam escorregadias, então o guia torna a progressão muito mais segura e eficiente.",userName:"Isabela D.",userPhotoUrl:null,isVerified:0,createdAt:"2024-08-30T12:00:00.000Z",updatedAt:"2024-08-30T12:00:00.000Z",images:[]},
          {id:6003,userId:0,rating:5,comment:"Dica para quem vai: a Trilha do Rio do Boi leva o dobro do tempo da trilha do topo. Separe o dia inteiro e não subestime o retorno, que exige o mesmo esforço que a descida ao fundo.",userName:"Thiago M.",userPhotoUrl:null,isVerified:0,createdAt:"2024-10-14T08:35:00.000Z",updatedAt:"2024-10-14T08:35:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_7':[
          {id:7001,userId:0,rating:5,comment:"Vale cada passo caminhar pela borda dos costões até a Rosa Sul. A lagoa de Ibiraquera aparece de repente entre as curvas e a vista com o oceano ao fundo é das mais bonitas do litoral catarinense.",userName:"Amanda V.",userPhotoUrl:null,isVerified:0,createdAt:"2024-05-24T09:10:00.000Z",updatedAt:"2024-05-24T09:10:00.000Z",images:[]},
          {id:7002,userId:0,rating:5,comment:"O trecho final descendo para a praia deserta antes da Rosa Sul compensa a caminhada toda. Em julho avistei baleias-franca com filhotes a menos de cem metros da costa, sem precisar de barco.",userName:"Rodrigo C.",userPhotoUrl:null,isVerified:0,createdAt:"2024-07-31T11:45:00.000Z",updatedAt:"2024-07-31T11:45:00.000Z",images:[]},
          {id:7003,userId:0,rating:4,comment:"Dica para quem vai: o melhor horário é cedo pela manhã, quando a luz é lateral e o mar fica espelhado. Em julho e agosto leve binóculos porque as baleias são avistadas com frequência da trilha.",userName:"Natalia G.",userPhotoUrl:null,isVerified:0,createdAt:"2024-09-03T07:55:00.000Z",updatedAt:"2024-09-03T07:55:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_8':[
          {id:8001,userId:0,rating:5,comment:"Trilha exigente como nenhuma outra no Brasil. O desnível de 3500 metros em quatro dias com mochila pesada na crista da Mantiqueira testa cada músculo. Não indicada para quem está na primeira expedição.",userName:"Leonardo J.",userPhotoUrl:null,isVerified:0,createdAt:"2024-04-28T13:00:00.000Z",updatedAt:"2024-04-28T13:00:00.000Z",images:[]},
          {id:8002,userId:0,rating:5,comment:"Visual incrível na crista entre a Pedra da Mina e o Pico dos Três Estados: vista simultânea para São Paulo, Minas e Rio de Janeiro num único ponto. A altimetria e o isolamento têm peso real.",userName:"Mariana Z.",userPhotoUrl:null,isVerified:0,createdAt:"2024-06-17T15:20:00.000Z",updatedAt:"2024-06-17T15:20:00.000Z",images:[]},
          {id:8003,userId:0,rating:4,comment:"Prepare-se para trechos técnicos sem sinalização clara e microclima imprevisível na crista. O guia especializado não é só obrigatório por regulamento, é indispensável para a segurança.",userName:"Felipe X.",userPhotoUrl:null,isVerified:0,createdAt:"2024-08-09T10:50:00.000Z",updatedAt:"2024-08-09T10:50:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_9':[
          {id:9001,userId:0,rating:5,comment:"O trecho final acima de 2600 metros é escalaminhada pura no granito escuro e fraturado. Cada passo precisa ser calculado, mas a vista do cume pontiagudo com nuvens circulando abaixo recompensa tudo.",userName:"Beatriz Q.",userPhotoUrl:null,isVerified:0,createdAt:"2024-03-16T08:05:00.000Z",updatedAt:"2024-03-16T08:05:00.000Z",images:[]},
          {id:9002,userId:0,rating:4,comment:"Prepare-se para frio intenso se a subida for no inverno com o céu aberto. A temperatura no cume cai bastante com o vento e o granito escorrega quando molhado. Agasalho e luvas não são exagero.",userName:"Henrique Y.",userPhotoUrl:null,isVerified:0,createdAt:"2024-05-07T12:30:00.000Z",updatedAt:"2024-05-07T12:30:00.000Z",images:[]},
          {id:9003,userId:0,rating:5,comment:"Dica para quem vai: o Abrigo Rebouças a 2350 metros tem capacidade limitada, então a reserva antecipada é essencial para quem quer pernoitar. A vista do cume ao amanhecer a partir do abrigo é incomparável.",userName:"Daniela I.",userPhotoUrl:null,isVerified:0,createdAt:"2024-07-22T06:00:00.000Z",updatedAt:"2024-07-22T06:00:00.000Z",images:[]}
        ],
        'trekko_reviews_trail_10':[
          {id:10001,userId:0,rating:5,comment:"Visual incrível na borda do abismo: 340 metros de queda livre e a água se desfaz em névoa antes de tocar o chão do cânion. Em março, com o rio cheio, o volume é impressionante e o barulho ecoa pelo vale.",userName:"Gabriel U.",userPhotoUrl:null,isVerified:0,createdAt:"2025-02-18T10:40:00.000Z",updatedAt:"2025-02-18T10:40:00.000Z",images:[]},
          {id:10002,userId:0,rating:4,comment:"Trilha exigente só na subida inicial, que concentra quase todo o desnível nos primeiros dois quilômetros com escadas naturais na rocha. Depois abre no campo rupestre e a caminhada flui até o mirante.",userName:"Renata V.",userPhotoUrl:null,isVerified:0,createdAt:"2025-03-05T09:20:00.000Z",updatedAt:"2025-03-05T09:20:00.000Z",images:[]},
          {id:10003,userId:0,rating:5,comment:"Dica para quem vai: vá entre fevereiro e abril para ver a cachoeira no volume máximo. Na seca o fio d'água diminui muito. O guia local conhece os atalhos para o melhor ângulo de observação.",userName:"Mateus W.",userPhotoUrl:null,isVerified:0,createdAt:"2025-04-02T11:15:00.000Z",updatedAt:"2025-04-02T11:15:00.000Z",images:[]}
        ]
