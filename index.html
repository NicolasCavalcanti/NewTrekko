      "trekko_reviews_trail_1":[
        {"id":1620000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Ricardo A.","userPhotoUrl":null,"createdAt":"2024-11-08T14:30:00.000Z","images":[],"comment":"A expedição de 7 dias ao Roraima foi transformadora. O guia indígena foi essencial — sem ele não há como fazer o percurso legalmente. A ficha do Trekko explica isso com clareza, diferente de outros sites que deixam a informação vaga."},
        {"id":1630000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Beatriz C.","userPhotoUrl":null,"createdAt":"2025-02-01T10:00:00.000Z","images":[],"comment":"Preparei tudo com base nas informações do Trekko. A estimativa de tempo estava perfeita e o alerta sobre as noites frias no topo (mesmo na Amazônia) salvou minha bagagem — levei o saco de dormir certo."},
        {"id":1640000000000,"userId":0,"rating":5,"isVerified":0,"userName":"Felipe M.","userPhotoUrl":null,"createdAt":"2025-03-26T09:00:00.000Z","images":[],"comment":"Tepui incrível. O desnível de 1.700 m e os 48 km estão exatos. Quem não tem experiência em expedição de múltiplos dias deve contratar um operador — o Trekko indica isso corretamente."}
      ],
      "trekko_reviews_trail_2":[
        {"id":1650000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Fernanda O.","userPhotoUrl":null,"createdAt":"2024-12-08T11:00:00.000Z","images":[],"comment":"A travessia mais bonita que já fiz no Brasil. O Trekko tinha todos os pontos de abastecimento de água corretos e a estimativa de 3 dias bateu exatamente para o nosso ritmo de grupo."},
        {"id":1660000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Carlos M.","userPhotoUrl":null,"createdAt":"2025-02-09T08:00:00.000Z","images":[],"comment":"30 km com 2.100 m de desnível na Serra dos Órgãos. Exatamente como descrito — classificação difícil está certíssima. Recomendo para quem já tem experiência em trekking de múltiplos dias."},
        {"id":1670000000000,"userId":0,"rating":4,"isVerified":0,"userName":"Ana R.","userPhotoUrl":null,"createdAt":"2025-04-07T15:30:00.000Z","images":[],"comment":"Levei um grupo pela primeira vez usando o Trekko como referência. A ficha detalha bem os acampamentos e pontos de água. Vale cada metro de desnível."}
      ],
      "trekko_reviews_trail_3":[
        {"id":1680000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Mariana T.","userPhotoUrl":null,"createdAt":"2024-12-28T13:00:00.000Z","images":[],"comment":"Vale da Lua é uma das paisagens mais surreais que já vi no Brasil. A trilha é acessível mesmo para quem nunca andou em trilhas longas — exatamente como o Trekko descreve."},
        {"id":1690000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Paulo S.","userPhotoUrl":null,"createdAt":"2025-03-06T09:30:00.000Z","images":[],"comment":"Combinei o Vale da Lua com as cachoeiras em um único dia usando o roteiro do Trekko. Funcionou perfeitamente. A informação sobre taxa de entrada estava atualizada."},
        {"id":1700000000000,"userId":0,"rating":5,"isVerified":0,"userName":"Júlia F.","userPhotoUrl":null,"createdAt":"2025-04-22T16:00:00.000Z","images":[],"comment":"Fiz minha primeira trilha com cachoeira aqui. O nível fácil está correto — dá pra fazer com crianças. Chapada dos Veadeiros é incrível."}
      ],
      "trekko_reviews_trail_4":[
        {"id":1710000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Rodrigo L.","userPhotoUrl":null,"createdAt":"2024-12-20T07:00:00.000Z","images":[],"comment":"A Pedra do Baú é um clássico paulista. A ficha do Trekko estima 4 a 6 horas — fizemos em 5 horas com paradas. O trecho final de escalada simples está bem descrito."},
        {"id":1720000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Camila P.","userPhotoUrl":null,"createdAt":"2025-02-26T08:00:00.000Z","images":[],"comment":"Vista 360° do topo vale todo o esforço. A trilha moderada exige preparo mas não é para atletas. Saí cedo (6h) como o Trekko recomenda — acertei em cheio."},
        {"id":1730000000000,"userId":0,"rating":4,"isVerified":0,"userName":"Diego N.","userPhotoUrl":null,"createdAt":"2025-04-17T14:00:00.000Z","images":[],"comment":"Ótima trilha de dia inteiro saindo de São Paulo. As coordenadas e o acesso pelo Trekko estavam corretos. Recomendo para quem quer uma trilha com altitude sem precisar ir longe."}
      ],
      "trekko_reviews_trail_5":[
        {"id":1740000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Thiago B.","userPhotoUrl":null,"createdAt":"2024-11-18T06:30:00.000Z","images":[],"comment":"O ponto mais alto da Mata Atlântica. 2.892 m com vistas para MG e ES. A ficha do Trekko detalha bem o acesso pelo Parque Nacional do Caparaó e a necessidade de pagar entrada."},
        {"id":1750000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Letícia V.","userPhotoUrl":null,"createdAt":"2025-02-22T07:00:00.000Z","images":[],"comment":"Subimos pelo lado mineiro como indicado. A classificação difícil é justa — o trecho final acima de 2.500 m com vento gelado exige preparo. Cada detalhe do Trekko estava correto."},
        {"id":1760000000000,"userId":0,"rating":5,"isVerified":0,"userName":"Marcos A.","userPhotoUrl":null,"createdAt":"2025-04-12T10:00:00.000Z","images":[],"comment":"Terceira trilha de alta montanha que faço usando o Trekko como referência. Informações confiáveis e a indicação de pernoite no abrigo foi decisiva para o planejamento."}
      ],
      "trekko_reviews_trail_6":[
        {"id":1770000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Sandra O.","userPhotoUrl":null,"createdAt":"2024-12-01T12:00:00.000Z","images":[],"comment":"Maior cânion da América Latina e merece todo o hype. O Trekko deixa claro que a Trilha do Rio do Boi exige guia obrigatório — informação crítica que muitos sites ignoram."},
        {"id":1780000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Gabriel M.","userPhotoUrl":null,"createdAt":"2025-02-19T09:00:00.000Z","images":[],"comment":"Fizemos a trilha de borda (Cotovelo + Vértice) sem guia, como indicado. Perfeita para iniciantes com vistas inesquecíveis. Em outro momento voltamos para descer ao fundo."},
        {"id":1790000000000,"userId":0,"rating":5,"isVerified":0,"userName":"Priscila K.","userPhotoUrl":null,"createdAt":"2025-04-19T16:00:00.000Z","images":[],"comment":"Cambará do Sul é friíssimo no inverno — levei as roupas certas graças ao aviso do Trekko. Os paredões de 720 m são de tirar o fôlego."}
      ],
      "trekko_reviews_trail_7":[
        {"id":1800000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Carolina M.","userPhotoUrl":null,"createdAt":"2024-12-12T14:00:00.000Z","images":[],"comment":"Trilha gratuita, fácil e com uma das paisagens mais bonitas do litoral sul. O Trekko indica que dá pra combinar com avistamento de baleias-franca entre julho e novembro — fizemos isso e foi mágico."},
        {"id":1810000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Bruno T.","userPhotoUrl":null,"createdAt":"2025-03-12T09:00:00.000Z","images":[],"comment":"Percurso de 6 km costeiro com vista para as três praias da Rosa. A estimativa de 2 a 3 horas está certa — fizemos em 2h30 com paradas para fotos. Ideal para quem está começando."},
        {"id":1820000000000,"userId":0,"rating":5,"isVerified":0,"userName":"Tânia R.","userPhotoUrl":null,"createdAt":"2025-04-27T11:00:00.000Z","images":[],"comment":"Primeira trilha da minha vida e escolhi bem. O nível fácil está correto. A Praia do Rosa em outubro com baleias ao fundo foi inesquecível."}
      ],
      "trekko_reviews_trail_8":[
        {"id":1830000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Henrique F.","userPhotoUrl":null,"createdAt":"2024-11-01T05:00:00.000Z","images":[],"comment":"A trilha mais difícil do Brasil e o Trekko descreve isso com precisão. 45 km, 5 picos acima de 2.700 m, guia obrigatório. Não há margem para amadores. Uma das experiências mais intensas da minha vida."},
        {"id":1840000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Aline C.","userPhotoUrl":null,"createdAt":"2025-01-28T07:00:00.000Z","images":[],"comment":"Travessia expert que exige meses de preparação. O Trekko lista isso claramente — e o guia que encontrei pelo site foi fundamental para navegar os trechos técnicos da crista da Mantiqueira."},
        {"id":1850000000000,"userId":0,"rating":5,"isVerified":0,"userName":"Igor S.","userPhotoUrl":null,"createdAt":"2025-04-02T08:00:00.000Z","images":[],"comment":"Cinco dias na Mantiqueira com desnível de 3.500 m. Ficha técnica precisa, guia excelente (indicado pelo Trekko). A classificação expert é mais que justificada."}
      ],
      "trekko_reviews_trail_9":[
        {"id":1860000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Renata A.","userPhotoUrl":null,"createdAt":"2025-01-17T07:00:00.000Z","images":[],"comment":"Os Lençóis de Paracuru são um segredo bem guardado do Ceará. A ficha do Trekko avisa que caminhar em areia fofa cansa muito mais que parece — lição que aprendi na pele, mas estava preparada."},
        {"id":1870000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Eduardo N.","userPhotoUrl":null,"createdAt":"2025-03-02T06:30:00.000Z","images":[],"comment":"Saí às 6h como recomendado e foi a decisão certa. O calor nordestino é intenso — o FPS 70 e o chapéu foram essenciais. As lagoas são lindíssimas e o percurso de 10 km é bem marcado."},
        {"id":1880000000000,"userId":0,"rating":4,"isVerified":0,"userName":"Patrícia L.","userPhotoUrl":null,"createdAt":"2025-04-15T10:00:00.000Z","images":[],"comment":"Vale a viagem de Fortaleza (85 km pela CE-085). O Trekko indica bem o acesso e avisa que guia local ajuda bastante na orientação pelas dunas. Recomendo contratar."}
      ],
      "trekko_reviews_trail_10":[
        {"id":1890000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Luciana M.","userPhotoUrl":null,"createdAt":"2024-12-14T07:00:00.000Z","images":[],"comment":"O Circuito dos 5 Lagos no Itatiaia é uma das trilhas mais recompensadoras do Rio. A ficha do Trekko foi precisa — 4,5 a 6 horas com os lagos em altitude acima de 2.300 m."},
        {"id":1900000000000,"userId":0,"rating":5,"isVerified":1,"userName":"Rafael P.","userPhotoUrl":null,"createdAt":"2025-02-23T08:00:00.000Z","images":[],"comment":"Trilha moderada com paisagem de alta montanha. As paradas nos Lagos Secos e Verde valeram cada esforço. O Trekko indicou a Pedra do Altar como parada obrigatória — acertou em cheio."},
        {"id":1910000000000,"userId":0,"rating":5,"isVerified":0,"userName":"Vanessa C.","userPhotoUrl":null,"createdAt":"2025-04-25T05:30:00.000Z","images":[],"comment":"Saímos antes do sol nascer como sugerido e chegamos aos lagos com névoa matinal. Espetacular. A ficha do Trekko preparou o grupo para o frio inesperado acima de 2.000 m."}
